summary: >-
  AutoFi's two machine-readable surfaces are not projections of one core — they
  are two different products on two different hosts. The OpenAPI at
  api.autofi.com describes the Lending-as-a-Service REST API; the MCP server at
  www.autofi.com/wp-json/mcp/mcp-oauth-server is a WordPress content surface on
  the marketing site. There is therefore NO tool-to-operation binding to record,
  and none has been invented. The crosswalk exists to state that divergence
  explicitly and to catalogue the REST operations that no agent tool reaches.
