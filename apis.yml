apis:
- name: AutoFi API
  description: >-
    AutoFi's public REST API (OpenAPI 3.0.0) for automotive lending and digital
    retail. Resource-oriented JSON endpoints for requesting a JWT access token
    with API client credentials, creating and retrieving loan applications,
    creating Dealmaker deals and credit applications, looking up AutoFi dealers,
    estimating cash, finance and lease payments, and running prequalification.
    Production runs at api.autofi.com with a UAT sandbox at api-uat.autofi.com
    that can simulate lender decisions per lender code.
  humanURL: https://api.autofi.com/api.html
  baseURL: https://api.autofi.com
