name: AutoFi
description: >-
  AutoFi ("The Sales Momentum Company") is an AI-powered automotive commerce
  platform that connects online and in-store car-buying experiences for
  dealerships, OEMs, lenders, and online marketplaces. Its products span digital
  retailing (online financing exploration and personalized deal paths with real
  payments and options), showroom solutions (in-store deal-structuring tools that
  preserve dealership profitability and buyer transparency), Dealmaker deal
  structuring, and Smartlink lead management. AutoFi publicly documents a REST
  API — the Lending-as-a-Service surface — at api.autofi.com covering JWT client
  credential authorization, loan application creation and retrieval, Dealmaker
  and credit application submission, dealer lookup, cash/finance/lease payment
  estimation, and prequalification, with a UAT sandbox that can simulate lender
  decisions. AutoFi was surfaced as a portfolio company of 500 Global.
