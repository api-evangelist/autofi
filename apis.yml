- name: AutoFi MCP Server
  description: >-
    Live, OAuth-protected Model Context Protocol server served from the WordPress
    installation behind autofi.com, discovered through RFC 9728 protected-resource
    metadata. It is a site/content MCP surface on AutoFi's marketing host, not an
    MCP wrapper around the lending API. Anonymous tools/list returns HTTP 401
    mcp_unauthorized, so the tool schemas require the `mcp` OAuth scope to read.
  humanURL: https://www.autofi.com/.well-known/oauth-protected-resource/
  baseURL: https://www.autofi.com/wp-json/mcp/mcp-oauth-server
