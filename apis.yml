name: AutoFi
description: >-
  AutoFi ("The Sales Momentum Company") is an AI-powered automotive commerce
  platform that connects online and in-store car-buying experiences for
  dealerships, OEMs, lenders, and online marketplaces. Its products span digital
  retailing (online financing exploration and personalized deal paths with real
  payments and options), showroom solutions (in-store deal-structuring tools that
  preserve dealership profitability and buyer transparency), and Smartlink lead
  management (funneling customer responses into dealership workflows). AutoFi was
  surfaced as a portfolio company of 500 Global and added to the API Evangelist
  network. As of enrichment it exposes no public developer API, portal, or
  documentation; this profile captures its public web and domain-security
  posture.
