- aid: autofi:autofi-authorization-api
  name: AutoFi Authorization API
  description: >-
    To authorize requests to the AutoFi API you will need an `Access Token` (JWT).


    Requesting an `Access Token` requires authentication credentials which you can retrieve from the AutoFi
    admin panel (coming soon).


    Once you have your `Access Token` you pass it in along in the authorization HTTP header like this:

    ```

    curl -X GET "https://api-uat.autofi.com/v1/loan-application/abcde" \

    -H "Authorization: Bearer 714552c6148e1617aeab526d0606184b94a80ec048fc09894ff1a72b740c5f19"

    ```

    Generally, all API endpoints require token authorization, except where noted otherwise (the endpoint
    description will be lacking the Authorization requirement).
  humanURL: https://api.autofi.com/api.html
  baseURL: https://api.autofi.com
