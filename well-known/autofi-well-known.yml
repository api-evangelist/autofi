summary: >-
  Two real /.well-known/ documents are served, both on the marketing host
  (www.autofi.com / autofi.com): an RFC 8414 OAuth 2.0 Authorization Server
  Metadata document and an RFC 9728 OAuth 2.0 Protected Resource Metadata
  document. Together they advertise a live, OAuth-protected MCP server at
  https://www.autofi.com/wp-json/mcp/mcp-oauth-server. Both are served from the
  WordPress site that runs autofi.com, not from the lending API host. Every
  /.well-known/ path on the API hosts (api.autofi.com, api-uat.autofi.com) and on
  auth/lender/portal returns 404 — no security.txt, no OIDC discovery, no API
  catalog, no ai-plugin, no A2A agent card anywhere.
gotcha: >-
  The canonical no-trailing-slash paths 301 to the trailing-slash form on the
  marketing host, so a probe that does not follow redirects records a 301 and
  misses both documents. Follow the redirect; the 200 bodies are genuine JSON
  (content-type application/json), not an HTML shell.
