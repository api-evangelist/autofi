    x-apievangelist-harvested-from: https://api.autofi.com/api.html
    x-apievangelist-harvest-method: redoc-embedded-state
- target: $.paths['/auth/token'].post
  update:
    operationId: createAccessToken
- target: $.paths['/v1/loan-application'].post
  update:
    operationId: createLoanApplication
- target: $.paths['/v1/loan-application/{loanApplicationId}'].get
  update:
    operationId: getLoanApplication
- target: $.paths['/v1/loan-application/{loanApplicationId}/externalResources'].get
