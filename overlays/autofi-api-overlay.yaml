overlay: 1.0.0
info:
  title: API Evangelist enhancements for the AutoFi API
  version: 1.0.0
extends: openapi/autofi-api-openapi.yml
x-generated: '2026-08-14'
x-method: generated
x-source: >-
  Enhancements derived from the AutoFi OpenAPI harvested from the Redoc bundle at
  https://api.autofi.com/api.html on 2026-08-14. The original document is never
  mutated; every change AutoFi's spec does not carry is expressed here.
x-note: >-
  The single largest machine-readability gap in the AutoFi contract is that NOT
  ONE of its 11 operations declares an operationId. Every tool generator, SDK
  generator, Arazzo workflow and MCP tool binding needs one, so this overlay
  proposes an operationId per operation, in AutoFi's own naming style. These are
  API Evangelist proposals, not AutoFi-published identifiers.
actions:
- target: $.info
  update:
